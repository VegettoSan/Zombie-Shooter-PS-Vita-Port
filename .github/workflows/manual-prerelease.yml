name: Manual Vita VPK Pre-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional test note shown in the pre-release"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: zombie-vita-manual-prerelease
  cancel-in-progress: false

jobs:
  build-and-prerelease:
    name: Build Debug + Release VPKs
    runs-on: ubuntu-latest
    container:
      # VitaSDK currently publishes the maintained Android-port SoftFP channel
      # under the nightly tag. Do not use the historical :latest image here.
      image: vitasdk/vitasdk-softfp:nightly

    defaults:
      run:
        shell: bash

    env:
      # Current vitasdk-softfp Docker images expose the SDK here.
      VITASDK: /usr/local/vitasdk

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify SoftFP toolchain
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"

          echo "VITASDK=$VITASDK"
          test -x "$VITASDK/bin/arm-vita-eabi-gcc"
          arm-vita-eabi-gcc --version
          arm-vita-eabi-g++ --version

          FLOAT_ABI="$(arm-vita-eabi-gcc -Q --help=target 2>/dev/null | awk '/-mfloat-abi=/{print $2; exit}')"
          echo "Detected -mfloat-abi=${FLOAT_ABI}"
          if [ "$FLOAT_ABI" != "softfp" ]; then
            echo "ERROR: This project requires a SoftFP VitaSDK, got: ${FLOAT_ABI:-unknown}" >&2
            exit 1
          fi

      - name: Verify required SoftFP packages
        run: |
          set -euo pipefail

          required_files=(
            "$VITASDK/arm-vita-eabi/lib/libOpenSLES.a"
            "$VITASDK/arm-vita-eabi/lib/libSceShaccCgExt.a"
            "$VITASDK/arm-vita-eabi/lib/libvitashark.a"
            "$VITASDK/arm-vita-eabi/lib/libmathneon.a"
            "$VITASDK/arm-vita-eabi/lib/libmpg123.a"
            "$VITASDK/arm-vita-eabi/lib/libopus.a"
            "$VITASDK/arm-vita-eabi/lib/libvorbis.a"
            "$VITASDK/arm-vita-eabi/lib/libogg.a"
            "$VITASDK/arm-vita-eabi/lib/libFLAC.a"
            "$VITASDK/arm-vita-eabi/lib/libsndfile.a"
            "$VITASDK/arm-vita-eabi/lib/libmp3lame.a"
          )

          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing target library: $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: The full SoftFP image is missing one or more required target libraries." >&2
            echo "Installed libraries matching the project dependencies:" >&2
            find "$VITASDK/arm-vita-eabi/lib" -maxdepth 1 -type f \
              \( -iname '*opensles*' -o -iname '*shacc*' -o -iname '*shark*' \
                 -o -iname '*mathneon*' -o -iname '*mpg123*' -o -iname '*opus*' \
                 -o -iname '*vorbis*' -o -iname '*ogg*' -o -iname '*flac*' \
                 -o -iname '*sndfile*' -o -iname '*lame*' \) -print >&2 || true
            exit 1
          fi

          echo "All required SoftFP target libraries are present."

      - name: Apply project patches to submodules
        run: |
          set -euo pipefail

          git -C lib/falso_jni apply --check ../../patches/falso_jni.patch
          git -C lib/falso_jni apply ../../patches/falso_jni.patch

          git -C lib/falso_ndk apply --check ../../patches/falso_ndk.patch
          git -C lib/falso_ndk apply ../../patches/falso_ndk.patch

          echo "FalsoJNI/FalsoNDK project patches applied."

      - name: Apply GCC 15 FalsoNDK compatibility fix
        run: |
          set -euo pipefail

          # The pinned FalsoNDK ASensor.cpp uses errno/EAGAIN/EINTR without
          # including <cerrno>. Older toolchains happened to compile it; GCC 15
          # correctly rejects it. Keep this CI-only compatibility shim small and
          # explicit instead of changing the pinned submodule revision.
          if ! grep -q '^#include <cerrno>$' lib/falso_ndk/android/ASensor.cpp; then
            sed -i '/^#include <algorithm>$/a #include <cerrno>' lib/falso_ndk/android/ASensor.cpp
          fi
          grep -n '^#include <cerrno>$' lib/falso_ndk/android/ASensor.cpp

      - name: Build Debug VPK
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"

          rm -rf build-ci-debug
          cmake -S . -B build-ci-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-ci-debug -j"$(nproc)" 2>&1 | tee build-ci-debug.log

          test -f build-ci-debug/zombie_shooter.vpk
          mkdir -p dist
          cp build-ci-debug/zombie_shooter.vpk dist/Zombie-Shooter-Vita-Debug.vpk

      - name: Build Release VPK
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"

          rm -rf build-ci-release
          cmake -S . -B build-ci-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci-release -j"$(nproc)" 2>&1 | tee build-ci-release.log

          test -f build-ci-release/zombie_shooter.vpk
          mkdir -p dist
          cp build-ci-release/zombie_shooter.vpk dist/Zombie-Shooter-Vita-Release.vpk

      - name: Generate build metadata
        id: meta
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="vita-test-${GITHUB_RUN_NUMBER}-${short_sha}"

          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          cat > dist/build-info.txt <<EOF
          Zombie Shooter PS Vita manual test build
          Run: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          SoftFP SDK: ${VITASDK}
          Docker image: vitasdk/vitasdk-softfp:nightly
          Assets included: NO (loader VPK only)
          Debug VPK: Zombie-Shooter-Vita-Debug.vpk
          Release VPK: Zombie-Shooter-Vita-Release.vpk
          EOF

          sha256sum dist/Zombie-Shooter-Vita-Debug.vpk \
                    dist/Zombie-Shooter-Vita-Release.vpk \
                    > dist/SHA256SUMS.txt

      - name: Upload workflow artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-Vita-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Zombie-Shooter-Vita-Debug.vpk
            dist/Zombie-Shooter-Vita-Release.vpk
            dist/build-info.txt
            dist/SHA256SUMS.txt

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zombie Shooter Vita Test #${{ github.run_number }} (${{ steps.meta.outputs.short_sha }})
          prerelease: true
          draft: false
          make_latest: false
          body: |
            Automated **manual test build** for real PS Vita hardware.

            - Commit: `${{ github.sha }}`
            - Ref: `${{ github.ref_name }}`
            - Toolchain: VitaSDK **SoftFP** (`nightly` channel)
            - Includes both **Debug** and **Release** VPKs
            - Does **not** include the proprietary Android APK/XAPK, `libzombie_shooter.so`, or game assets

            Debug is intended for logs/crash investigation. Release is intended for normal gameplay/FPS testing.

            Test note:
            `${{ inputs.notes }}`
          files: |
            dist/Zombie-Shooter-Vita-Debug.vpk
            dist/Zombie-Shooter-Vita-Release.vpk
            dist/build-info.txt
            dist/SHA256SUMS.txt

name: Manual Vita VPK Pre-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional test note shown in the pre-release"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: zombie-vita-manual-prerelease
  cancel-in-progress: false

jobs:
  build-and-prerelease:
    name: Build Debug + Release VPKs
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk-softfp:nightly

    defaults:
      run:
        shell: bash

    env:
      VITASDK: /usr/local/vitasdk

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify SoftFP toolchain
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          echo "VITASDK=$VITASDK"
          test -x "$VITASDK/bin/arm-vita-eabi-gcc"
          arm-vita-eabi-gcc --version
          arm-vita-eabi-g++ --version
          FLOAT_ABI="$(arm-vita-eabi-gcc -Q --help=target 2>/dev/null | awk '/-mfloat-abi=/{print $2; exit}')"
          echo "Detected -mfloat-abi=${FLOAT_ABI}"
          if [ "$FLOAT_ABI" != "softfp" ]; then
            echo "ERROR: This project requires a SoftFP VitaSDK, got: ${FLOAT_ABI:-unknown}" >&2
            exit 1
          fi

      - name: Verify required SoftFP packages
        run: |
          set -euo pipefail
          required_files=(
            "$VITASDK/arm-vita-eabi/lib/libOpenSLES.a"
            "$VITASDK/arm-vita-eabi/lib/libSceShaccCgExt.a"
            "$VITASDK/arm-vita-eabi/lib/libvitashark.a"
            "$VITASDK/arm-vita-eabi/lib/libmathneon.a"
            "$VITASDK/arm-vita-eabi/lib/libmpg123.a"
            "$VITASDK/arm-vita-eabi/lib/libopus.a"
            "$VITASDK/arm-vita-eabi/lib/libvorbis.a"
            "$VITASDK/arm-vita-eabi/lib/libogg.a"
            "$VITASDK/arm-vita-eabi/lib/libFLAC.a"
            "$VITASDK/arm-vita-eabi/lib/libsndfile.a"
            "$VITASDK/arm-vita-eabi/lib/libmp3lame.a"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing target library: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: The full SoftFP image is missing one or more required target libraries." >&2
            find "$VITASDK/arm-vita-eabi/lib" -maxdepth 1 -type f \
              \( -iname '*opensles*' -o -iname '*shacc*' -o -iname '*shark*' \
                 -o -iname '*mathneon*' -o -iname '*mpg123*' -o -iname '*opus*' \
                 -o -iname '*vorbis*' -o -iname '*ogg*' -o -iname '*flac*' \
                 -o -iname '*sndfile*' -o -iname '*lame*' \) -print >&2 || true
            exit 1
          fi
          echo "All required SoftFP target libraries are present."

      - name: Apply project patches to submodules
        run: |
          set -euo pipefail
          git -C lib/falso_jni apply --check ../../patches/falso_jni.patch
          git -C lib/falso_jni apply ../../patches/falso_jni.patch
          git -C lib/falso_ndk apply --check ../../patches/falso_ndk.patch
          git -C lib/falso_ndk apply ../../patches/falso_ndk.patch
          echo "FalsoJNI/FalsoNDK project patches applied."

      - name: Apply GCC 15 FalsoNDK compatibility fix
        run: |
          set -euo pipefail
          if ! grep -q '^#include <cerrno>$' lib/falso_ndk/android/ASensor.cpp; then
            sed -i '/^#include <algorithm>$/a #include <cerrno>' lib/falso_ndk/android/ASensor.cpp
          fi
          grep -n '^#include <cerrno>$' lib/falso_ndk/android/ASensor.cpp

      - name: Analyze canonical game SO crash window
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          mkdir -p dist
          SO=demo/libzombie_shooter.so
          test -f "$SO"
          test "$(stat -c %s "$SO")" -eq 9773412

          sha256sum "$SO" > dist/so-reference.sha256.txt
          arm-vita-eabi-nm -anC "$SO" > /tmp/zombie-so-nm.txt || true

          {
            echo "Zombie Shooter canonical SO crash-window analysis"
            echo "File: $SO"
            echo "Size: $(stat -c %s "$SO") bytes"
            cat dist/so-reference.sha256.txt
            echo
            echo "Crash from real Vita dump:"
            echo "PC  = 0x98515AE4 -> SO+0x00515AE4"
            echo "LR  = 0x98515A5F -> SO+0x00515A5F"
            echo "DFAR= 0x07D36E9C"
            echo
            echo "addr2line:"
            arm-vita-eabi-addr2line -Cfipe "$SO" \
              0x00515AE4 0x00515A5F 0x00515F5F 0x00515961 0x0050BB99 || true
            echo
            echo "Nearest named symbols (+/- 0x2000 around PC):"
            python3 - <<'PY'
          from pathlib import Path
          target = 0x00515AE4
          rows = []
          for line in Path('/tmp/zombie-so-nm.txt').read_text(errors='replace').splitlines():
              parts = line.split(maxsplit=2)
              if len(parts) < 2:
                  continue
              try:
                  addr = int(parts[0], 16)
              except ValueError:
                  continue
              if abs(addr - target) <= 0x2000:
                  rows.append((addr, line))
          for _, line in rows:
              print(line)
          PY
            echo
            echo "Disassembly standard:"
            arm-vita-eabi-objdump -d -C \
              --start-address=0x00515900 --stop-address=0x00515C80 "$SO" || true
            echo
            echo "Disassembly forced Thumb (same window):"
            arm-vita-eabi-objdump -D -C -M force-thumb \
              --start-address=0x00515900 --stop-address=0x00515C80 "$SO" || true
          } > dist/crash-zone-disasm.txt

          echo "=== crash-zone-disasm.txt (first 220 lines) ==="
          sed -n '1,220p' dist/crash-zone-disasm.txt

      - name: Build VitaSDK nightly getentropy compatibility object
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cat > "$GITHUB_WORKSPACE/ci_getentropy_compat.c" <<'EOF'
          #include <errno.h>
          #include <reent.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <psp2/kernel/rng.h>

          __attribute__((weak))
          int _getentropy_r(struct _reent *reent, void *buffer, size_t length) {
              if (!reent || (!buffer && length) || length > 256) {
                  if (reent) reent->_errno = EIO;
                  return -1;
              }
              uint8_t *out = (uint8_t *)buffer;
              size_t remaining = length;
              while (remaining) {
                  SceSize chunk = remaining > 64 ? 64 : (SceSize)remaining;
                  if (sceKernelGetRandomNumber(out, chunk) < 0) {
                      reent->_errno = EIO;
                      return -1;
                  }
                  out += chunk;
                  remaining -= chunk;
              }
              return 0;
          }
          EOF
          arm-vita-eabi-gcc -mfloat-abi=softfp -O2 -c \
            "$GITHUB_WORKSPACE/ci_getentropy_compat.c" \
            -o "$GITHUB_WORKSPACE/ci_getentropy_compat.o"
          test -f "$GITHUB_WORKSPACE/ci_getentropy_compat.o"

      - name: Build Debug VPK
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          short_sha="${GITHUB_SHA:0:7}"
          rm -rf build-ci-debug
          cmake -S . -B build-ci-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZOMBIE_BUILD_ID="$short_sha" \
            -DCMAKE_EXE_LINKER_FLAGS="$GITHUB_WORKSPACE/ci_getentropy_compat.o"

          echo "=== Debug compile definitions ==="
          cat build-ci-debug/CMakeFiles/so_loader.dir/flags.make
          grep -q 'ZOMBIE_DEBUG_BUILD=1' build-ci-debug/CMakeFiles/so_loader.dir/flags.make
          grep -q 'FALSOJNI_DEBUGLEVEL=0' build-ci-debug/CMakeFiles/so_loader.dir/flags.make
          if grep -q 'ZOMBIE_RELEASE_BUILD=1' build-ci-debug/CMakeFiles/so_loader.dir/flags.make; then
            echo "ERROR: Debug configuration contains Release identity" >&2
            exit 1
          fi

          cmake --build build-ci-debug -j"$(nproc)" 2>&1 | tee build-ci-debug.log
          test -f build-ci-debug/zombie_shooter.vpk
          mkdir -p dist
          cp build-ci-debug/zombie_shooter.vpk dist/Zombie-Shooter-Vita-Debug.vpk

      - name: Build Release VPK
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          short_sha="${GITHUB_SHA:0:7}"
          rm -rf build-ci-release
          cmake -S . -B build-ci-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DZOMBIE_BUILD_ID="$short_sha" \
            -DCMAKE_EXE_LINKER_FLAGS="$GITHUB_WORKSPACE/ci_getentropy_compat.o"

          echo "=== Release compile definitions ==="
          cat build-ci-release/CMakeFiles/so_loader.dir/flags.make
          grep -q 'ZOMBIE_RELEASE_BUILD=1' build-ci-release/CMakeFiles/so_loader.dir/flags.make
          grep -q 'FALSOJNI_DEBUGLEVEL=4' build-ci-release/CMakeFiles/so_loader.dir/flags.make
          if grep -q 'ZOMBIE_DEBUG_BUILD=1' build-ci-release/CMakeFiles/so_loader.dir/flags.make; then
            echo "ERROR: Release configuration contains Debug identity" >&2
            exit 1
          fi

          cmake --build build-ci-release -j"$(nproc)" 2>&1 | tee build-ci-release.log
          test -f build-ci-release/zombie_shooter.vpk
          mkdir -p dist
          cp build-ci-release/zombie_shooter.vpk dist/Zombie-Shooter-Vita-Release.vpk

          {
            echo "=== DEBUG flags ==="
            cat build-ci-debug/CMakeFiles/so_loader.dir/flags.make
            echo
            echo "=== RELEASE flags ==="
            cat build-ci-release/CMakeFiles/so_loader.dir/flags.make
          } > dist/build-flags.txt

      - name: Generate build metadata
        id: meta
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="vita-test-${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cat > dist/build-info.txt <<EOF
          Zombie Shooter PS Vita manual test build
          Run: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          Build ID embedded in logs: ${short_sha}
          SoftFP SDK: ${VITASDK}
          Docker image: vitasdk/vitasdk-softfp:nightly
          Assets included: NO (loader VPK only)
          Debug VPK: Zombie-Shooter-Vita-Debug.vpk
          Release VPK: Zombie-Shooter-Vita-Release.vpk
          EOF
          sha256sum dist/Zombie-Shooter-Vita-Debug.vpk \
                    dist/Zombie-Shooter-Vita-Release.vpk \
                    > dist/SHA256SUMS.txt

      - name: Upload workflow artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-Vita-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Zombie-Shooter-Vita-Debug.vpk
            dist/Zombie-Shooter-Vita-Release.vpk
            dist/build-info.txt
            dist/build-flags.txt
            dist/SHA256SUMS.txt
            dist/so-reference.sha256.txt
            dist/crash-zone-disasm.txt

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zombie Shooter Vita Test #${{ github.run_number }} (${{ steps.meta.outputs.short_sha }})
          prerelease: true
          draft: false
          make_latest: false
          body: |
            Automated **manual test build** for real PS Vita hardware.

            - Commit: `${{ github.sha }}`
            - Ref: `${{ github.ref_name }}`
            - Embedded build ID: `${{ steps.meta.outputs.short_sha }}`
            - Toolchain: VitaSDK **SoftFP** (`nightly` channel)
            - Includes both **Debug** and **Release** VPKs
            - Does **not** include the proprietary Android APK/XAPK, `libzombie_shooter.so`, or game assets

            Debug is intended for logs/crash investigation. Release is intended for normal gameplay/FPS testing.

            Test note:
            `${{ inputs.notes }}`
          files: |
            dist/Zombie-Shooter-Vita-Debug.vpk
            dist/Zombie-Shooter-Vita-Release.vpk
            dist/build-info.txt
            dist/SHA256SUMS.txt

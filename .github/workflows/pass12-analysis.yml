name: Pass12 map analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install exact SoftFP SDK
        run: bash scripts/install_baseline_sdk.sh
      - name: Analyze MAP and GRAPH hot call sites
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          OUT=pass12-analysis.txt
          : > "$OUT"
          echo '=== selected symbols ===' >> "$OUT"
          arm-vita-eabi-nm -D -n -C demo/libzombie_shooter.so | grep -E 'MAP::(tact|update|StartTact|compressionTact)|SPRITE::Tact|UNIT::Tact|BaseUnitAbility::tact|GRAPH::Tact|GRAPH::softwareTact|MapLoader::tact|sound::Base.*::tact' >> "$OUT" || true
          echo >> "$OUT"
          echo '=== MAP::tact disassembly 0x4372c4..0x4379e4 ===' >> "$OUT"
          arm-vita-eabi-objdump -C -d --start-address=0x4372c4 --stop-address=0x4379e4 demo/libzombie_shooter.so >> "$OUT"
          echo >> "$OUT"
          echo '=== MAP::tact branches/calls ===' >> "$OUT"
          arm-vita-eabi-objdump -C -d --start-address=0x4372c4 --stop-address=0x4379e4 demo/libzombie_shooter.so | grep -E '\b(bl|blx)\b' >> "$OUT" || true
          echo >> "$OUT"
          echo '=== MAP::update disassembly ===' >> "$OUT"
          arm-vita-eabi-objdump -C -d --start-address=0x436c6c --stop-address=0x436cc8 demo/libzombie_shooter.so >> "$OUT"
          echo >> "$OUT"
          echo '=== UNIT::Tact symbol + calls ===' >> "$OUT"
          arm-vita-eabi-readelf -Ws demo/libzombie_shooter.so | grep '_ZN4UNIT4TactEv' >> "$OUT" || true
          arm-vita-eabi-objdump -C -d --start-address=0x4fc110 --stop-address=0x4fd000 demo/libzombie_shooter.so | grep -E '\b(bl|blx)\b' >> "$OUT" || true
          echo >> "$OUT"
          echo '=== SPRITE::Tact symbol + calls ===' >> "$OUT"
          arm-vita-eabi-readelf -Ws demo/libzombie_shooter.so | grep '_ZN6SPRITE4TactEv' >> "$OUT" || true
          arm-vita-eabi-objdump -C -d --start-address=0x4dbe40 --stop-address=0x4dce40 demo/libzombie_shooter.so | grep -E '\b(bl|blx)\b' >> "$OUT" || true
      - uses: actions/upload-artifact@v4
        with:
          name: pass12-map-analysis
          path: pass12-analysis.txt
          retention-days: 3

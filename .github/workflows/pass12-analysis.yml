name: Pass12 map analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install exact SoftFP SDK
        run: bash scripts/install_baseline_sdk.sh
      - name: Analyze MAP and GRAPH hot call sites
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          OUT=pass12-analysis.txt
          : > "$OUT"
          echo '=== selected symbols ===' >> "$OUT"
          arm-vita-eabi-nm -D -n -C demo/libzombie_shooter.so | grep -E 'MAP::(tact|update|StartTact|compressionTact|isShowShadows)|SPRITE::Tact|UNIT::Tact|BaseUnitAbility::tact|SPRITE_COLLECTOR::DrawShadowInLayer|GRAPH::Tact|GRAPH::softwareTact|MapLoader::tact|sound::Base.*::tact' >> "$OUT" || true
          echo >> "$OUT"
          echo '=== MAP::tact disassembly 0x4372c4..0x4379e4 ===' >> "$OUT"
          arm-vita-eabi-objdump -C -d --start-address=0x4372c4 --stop-address=0x4379e4 demo/libzombie_shooter.so >> "$OUT"
          echo >> "$OUT"
          echo '=== hook candidate headers ===' >> "$OUT"
          for range in '0x4fc110 0x4fc130' '0x4dbe40 0x4dbe60' '0x4f4dbc 0x4f4de0' '0x435644 0x435670' '0x50093c 0x500960'; do
            set -- $range
            arm-vita-eabi-objdump -C -d --start-address=$1 --stop-address=$2 demo/libzombie_shooter.so >> "$OUT"
          done
          echo >> "$OUT"
          echo '=== relevant symbol sizes ===' >> "$OUT"
          arm-vita-eabi-readelf -Ws demo/libzombie_shooter.so | grep -E '_ZN4UNIT4TactEv|_ZN6SPRITE4TactEv|_ZNK16SPRITE_COLLECTOR17DrawShadowInLayer|_ZNK3MAP13isShowShadowsEv|BaseUnitAbility.*tact' >> "$OUT" || true
      - uses: actions/upload-artifact@v4
        with:
          name: pass12-map-analysis
          path: pass12-analysis.txt
          retention-days: 3

name: Pass10 framebuffer analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify combined VitaGL patches
        run: |
          set -euo pipefail
          git -C lib/vitagl apply --ignore-space-change --check "$GITHUB_WORKSPACE/patches/vitagl.patch"
          git -C lib/vitagl apply --ignore-space-change "$GITHUB_WORKSPACE/patches/vitagl.patch"
          git -C lib/vitagl apply --ignore-space-change --check "$GITHUB_WORKSPACE/patches/vitagl_pass10.patch"
          git -C lib/vitagl apply --ignore-space-change "$GITHUB_WORKSPACE/patches/vitagl_pass10.patch"
          {
            echo '=== FINAL NORMALIZED HASHES ==='
            python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ['lib/vitagl/source/textures.c','lib/vitagl/source/utils/zombie_texture_update.h']:
              data=Path(name).read_bytes().replace(b'\r\n',b'\n')
              print(hashlib.sha256(data).hexdigest(), name)
          PY
            echo '=== PASS10 CONVERTER SITES ==='
            grep -n -A25 -B10 'rgba_to_rgb565\|rgba8888_to_rgb565' lib/vitagl/source/textures.c lib/vitagl/source/utils/zombie_texture_update.h
          } > pass10-analysis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass10-framebuffer-analysis
          path: pass10-analysis.txt
          retention-days: 7

name: Pass12 callgraph analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install exact SoftFP SDK
        run: bash scripts/install_baseline_sdk.sh
      - name: Analyze MAP and GRAPH call graph
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          python3 -m pip install --quiet --target /tmp/zsdeps pyelftools==0.32 capstone==5.0.6
          PYTHONPATH=/tmp/zsdeps python3 - <<'PY' > pass12-callgraph.txt
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM

          path='demo/libzombie_shooter.so'
          with open(path,'rb') as f:
              elf=ELFFile(f)
              dyn=elf.get_section_by_name('.dynsym')
              syms={s.name:s for s in dyn.iter_symbols()}
              targets={
                  '_ZN5GRAPH4TactEi':'GRAPH::Tact(int)',
                  '_ZN5GRAPH12softwareTactEi':'GRAPH::softwareTact(int)',
                  '_ZN3MAP4tactEv':'MAP::tact()',
              }
              text=elf.get_section_by_name('.text'); base=text['sh_addr']; blob=text.data()
              md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
              print('=== exact symbols ===')
              for n,label in targets.items():
                  s=syms[n]; addr=s['st_value']&~1; size=s['st_size']
                  print(label,hex(addr),'size',size,'end',hex(addr+size))
              print('\n=== dynamic symbols near game hot paths ===')
              for s in dyn.iter_symbols():
                  a=s['st_value']&~1
                  if a and (0x400000 <= a <= 0x520000):
                      print(hex(a),s['st_size'],s.name)

              for n,label in targets.items():
                  s=syms[n]; addr=s['st_value']&~1; size=s['st_size']
                  code=blob[addr-base:addr-base+size]
                  print(f'\n=== {label} calls ===')
                  for ins in md.disasm(code,addr):
                      if ins.mnemonic in ('bl','blx') and ins.operands and ins.operands[0].type==ARM_OP_IMM:
                          print(hex(ins.address),ins.mnemonic,hex(ins.operands[0].imm))

              print('\n=== PLT relocations ===')
              for secname in ('.rel.plt','.rela.plt','.rel.dyn','.rela.dyn'):
                  sec=elf.get_section_by_name(secname)
                  if sec is None: continue
                  symtab=elf.get_section(sec['sh_link'])
                  print('SECTION',secname)
                  for i,rel in enumerate(sec.iter_relocations()):
                      idx=rel['r_info_sym']; name=symtab.get_symbol(idx).name if idx else ''
                      print(i,hex(rel['r_offset']),name)
          PY
          {
            echo '=== PLT disassembly ==='
            arm-vita-eabi-objdump -d -j .plt demo/libzombie_shooter.so || true
          } >> pass12-callgraph.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass12-callgraph
          path: pass12-callgraph.txt
          retention-days: 3

name: Pass11 repair glutil
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/run16-disable-render-scale
          fetch-depth: 0
      - name: Restore complete glutil and move declarations only
        run: |
          set -euo pipefail
          git show d683decfb2f1012cc269a2b04803bb45f03335a2:source/utils/glutil.c > source/utils/glutil.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/utils/glutil.c')
          s=p.read_text()
          old='''static struct { uintptr_t caller; unsigned calls, us, max_us; int w,h; GLenum format,type; } upload_groups[8];\nstatic void report_texture_costs(void) {'''
          new='''static struct { uintptr_t caller; unsigned calls, us, max_us; int w,h; GLenum format,type; } upload_groups[8];\nextern volatile int zombie_render_reuse_active_this_tick;\nstatic unsigned render_reuse_uploads_skipped;\nstatic void report_texture_costs(void) {'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old2='''static volatile unsigned present_count;\nstatic volatile unsigned last_present_ms;\nextern volatile int zombie_render_reuse_active_this_tick;\nstatic unsigned render_reuse_uploads_skipped;'''
          new2='''static volatile unsigned present_count;\nstatic volatile unsigned last_present_ms;'''
          assert s.count(old2)==1, s.count(old2)
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'VegettoSanDev'
          git config user.email '72358120+VegettoSan@users.noreply.github.com'
          git add source/utils/glutil.c
          git commit -m 'fix: preserve complete Pass11 glutil source'
          git push origin HEAD:fix/run16-disable-render-scale

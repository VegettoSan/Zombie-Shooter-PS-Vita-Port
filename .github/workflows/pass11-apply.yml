name: Pass11 apply render reuse
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/run16-disable-render-scale
          fetch-depth: 0
      - name: Apply Pass11 source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s:
                  return False
              if old not in s:
                  raise SystemExit(f'expected block missing in {path}')
              if s.count(old) != 1:
                  raise SystemExit(f'expected unique block in {path}, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
              return True

          changed=False
          changed |= replace_once('source/patch.c',
              '#include "utils/perf.h"\n#include "utils/engine_probe.h"',
              '#include "utils/perf.h"\n#include "utils/settings.h"\n#include "utils/engine_probe.h"')

          changed |= replace_once('source/patch.c',
              'ENGINE_INT_PROBE(graph,PERF_ENGINE_GRAPH)\nENGINE_INT_PROBE(software,PERF_ENGINE_SOFTWARE)\nENGINE_THIS_PROBE(map,PERF_ENGINE_MAP)',
              '''ENGINE_INT_PROBE(graph,PERF_ENGINE_GRAPH)\n\n/* Pass 11: MetalSyntax-style render reuse.  GRAPH::Tact/MAP/input/audio keep\n * running every engine tick; only the expensive software raster pass is\n * reused every other tick.  The opaque original return is preserved so no\n * caller contract changes.  glTexSubImage2D_soloader sees the per-tick flag\n * and skips only OpenGLES::UnLock's full software-framebuffer upload. */\nvolatile int zombie_render_reuse_active_this_tick = 0;\nstatic uintptr_t render_reuse_last_software_result;\nstatic unsigned render_reuse_phase;\nstatic unsigned render_reuse_rendered;\nstatic unsigned render_reuse_reused;\nstatic int render_reuse_has_frame;\n\nstatic uintptr_t probe_software(void *self,int argument) {\n    int reuse = setting_software_frameskip && render_reuse_has_frame &&\n                ((render_reuse_phase++ & 1u) != 0);\n    if (reuse) {\n        zombie_render_reuse_active_this_tick = 1;\n        render_reuse_reused++;\n        return render_reuse_last_software_result;\n    }\n    zombie_render_reuse_active_this_tick = 0;\n    uint64_t start=sceKernelGetProcessTimeWide();\n    uintptr_t ret=((uintptr_t (*)(void *,int))engine_original[PERF_ENGINE_SOFTWARE])(self,argument);\n    perf_engine_phase(PERF_ENGINE_SOFTWARE,start);\n    render_reuse_last_software_result=ret;\n    render_reuse_has_frame=1;\n    render_reuse_rendered++;\n    return ret;\n}\n\nvoid render_reuse_report(void) {\n    static unsigned old_rendered,old_reused;\n    unsigned rendered=render_reuse_rendered, reused=render_reuse_reused;\n    l_perf("render_reuse config=%d rendered_ticks=%u reused_ticks=%u has_frame=%d current_reuse=%d strategy=softwareTact_2to1",\n        setting_software_frameskip,rendered-old_rendered,reused-old_reused,\n        render_reuse_has_frame,zombie_render_reuse_active_this_tick);\n    old_rendered=rendered;old_reused=reused;\n}\n\nENGINE_THIS_PROBE(map,PERF_ENGINE_MAP)''')

          changed |= replace_once('source/utils/perf.c',
              'void raster_palette_report(void);\nvoid raster_alpha_report(void);\nvoid perf_report(void) {\n    raster_palette_report();\n    raster_alpha_report();',
              'void raster_palette_report(void);\nvoid raster_alpha_report(void);\nvoid render_reuse_report(void);\nvoid perf_report(void) {\n    raster_palette_report();\n    raster_alpha_report();\n    render_reuse_report();')

          changed |= replace_once('source/utils/glutil.c',
              'static volatile unsigned present_count;\nstatic volatile unsigned last_present_ms;',
              'static volatile unsigned present_count;\nstatic volatile unsigned last_present_ms;\nextern volatile int zombie_render_reuse_active_this_tick;\nstatic unsigned render_reuse_uploads_skipped;')

          changed |= replace_once('source/utils/glutil.c',
              '''    if (is_software_framebuffer_upload(caller,target,level,xoffset,yoffset,width,height,format,type,data))\n        framebuffer565_reinit_if_needed(target,width,height);\n\n    uint64_t start = sceKernelGetProcessTimeWide();''',
              '''    /* Pass 11: reuse only the proven final software-framebuffer upload.\n     * PostTact itself still runs, preserving OpenGLES lock/unlock/state semantics.\n     * The caller+shape+format gate prevents unrelated textures being skipped. */\n    if (setting_software_frameskip && zombie_render_reuse_active_this_tick && data &&\n        caller == guest_return(SOFTWARE_UNLOCK_TEXSUB_RETURN) &&\n        target == GL_TEXTURE_2D && level == 0 && xoffset == 0 && yoffset == 0 &&\n        format == GL_RGBA && type == GL_UNSIGNED_BYTE &&\n        width >= 720 && width <= 1100 && height >= 400 && height <= 650) {\n        render_reuse_uploads_skipped++;\n        return;\n    }\n\n    if (is_software_framebuffer_upload(caller,target,level,xoffset,yoffset,width,height,format,type,data))\n        framebuffer565_reinit_if_needed(target,width,height);\n\n    uint64_t start = sceKernelGetProcessTimeWide();''')

          changed |= replace_once('source/utils/glutil.c',
              '''    l_perf("framebuffer_565 config=%d active=%d surface=%dx%d reinit_calls=%u reinit_us=%u reinit_max_us=%u convert_calls=%u convert_pixels=%llu convert_us=%u convert_max_us=%u input_bytes=%llu output_bytes=%llu",\n        setting_framebuffer_565, framebuffer565.active, framebuffer565.width, framebuffer565.height,\n        framebuffer565.reinit_calls, framebuffer565.reinit_us, framebuffer565.reinit_max_us,\n        cow.rgba565_calls, (unsigned long long)cow.rgba565_pixels, cow.rgba565_us, cow.rgba565_max_us,\n        (unsigned long long)cow.rgba565_input_bytes, (unsigned long long)cow.rgba565_output_bytes);''',
              '''    l_perf("framebuffer_565 config=%d active=%d surface=%dx%d reinit_calls=%u reinit_us=%u reinit_max_us=%u convert_calls=%u convert_pixels=%llu convert_us=%u convert_max_us=%u input_bytes=%llu output_bytes=%llu",\n        setting_framebuffer_565, framebuffer565.active, framebuffer565.width, framebuffer565.height,\n        framebuffer565.reinit_calls, framebuffer565.reinit_us, framebuffer565.reinit_max_us,\n        cow.rgba565_calls, (unsigned long long)cow.rgba565_pixels, cow.rgba565_us, cow.rgba565_max_us,\n        (unsigned long long)cow.rgba565_input_bytes, (unsigned long long)cow.rgba565_output_bytes);\n    l_perf("frame_reuse skipped_framebuffer_uploads_lifetime=%u caller=0x%08X strategy=caller_exact_full_rgba",\n        render_reuse_uploads_skipped,(unsigned)guest_return(SOFTWARE_UNLOCK_TEXSUB_RETURN));''')

          if not changed:
              print('Pass11 changes already applied; nothing to do')
          PY

          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git diff --check
          git config user.name 'VegettoSanDev'
          git config user.email '72358120+VegettoSan@users.noreply.github.com'
          git add source/patch.c source/utils/perf.c source/utils/glutil.c
          git commit -m 'perf: reuse software framebuffer on alternate ticks'
          git push origin HEAD:fix/run16-disable-render-scale

name: Pass12 validation
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  validate-pass12:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify canonical SO
        run: |
          set -euo pipefail
          echo '5e5e2e1bbe86e126c3e2dce5ad97c2e9dc6282305ea7d3e24b49ee4769c5b5b7  demo/libzombie_shooter.so' | sha256sum -c -
      - name: Install exact SoftFP SDK
        run: bash scripts/install_baseline_sdk.sh
      - name: Host regressions
        run: |
          set -euo pipefail
          tests/run_jni_field_regression.sh
          bash tests/run_gamepad_regression.sh
          python3 tests/run_render_scale_regression.py
          tests/run_gl_buffer_regression.sh
          tests/run_logger_regression.sh
          bash tests/run_texture_update_regression.sh
          bash tests/run_framebuffer_565_regression.sh
          bash tests/run_asset_index_regression.sh
          bash tests/run_engine_probe_regression.sh
          python3 tests/run_gamma_palette_regression.py
          grep -q 'software_frameskip' source/utils/settings.c
          grep -q 'strategy=software_graph_adaptive30' source/patch.c
          grep -q 'RENDER_REUSE_TARGET_US 33333u' source/patch.c
          grep -q 'RENDER_REUSE_MAX_SKIPS 3u' source/patch.c
          grep -q 'static uintptr_t probe_map' source/patch.c
          grep -q 'render_reuse_choose_skips' source/patch.c
          grep -q 'graph_reused' source/patch.c
          ! grep -q 'render_reuse_phase' source/patch.c
          grep -q 'SOFTWARE_UNLOCK_TEXSUB_RETURN' source/utils/glutil.c
          grep -q '#define VITA_AUDIO_OUT_FRAMES 1024u' lib/opensles_clear/Vita.c
          grep -q '#define VITA_AUDIO_OUT_BUFFERS 4u' lib/opensles_clear/Vita.c
          grep -q 'output_late_intervals' source/utils/perf.c
          grep -q 'output_frames' source/utils/perf.c
          ! grep -q 'SndFile_BUFSIZE / 4' lib/opensles_clear/Vita.c
          python3 - <<'PY'
          TARGET=33333
          MAX=3
          def choose(full,reuse):
              if full <= TARGET: return 0
              if not reuse or reuse >= TARGET: return 1
              n=full-TARGET; d=TARGET-reuse
              return max(1,min(MAX,(n+d-1)//d))
          assert choose(30000,8000)==0
          assert choose(40000,0)==1
          assert choose(40000,35000)==1
          assert choose(60000,10000)==2
          assert choose(108000,8000)==3
          assert choose(200000,5000)==3
          print('PASS adaptive30 pacing arithmetic')
          PY
      - name: Verify canonical render call graph and prologues
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          python3 -m pip install --quiet --target /tmp/zombie-arm-test-deps unicorn==2.1.4 pyelftools==0.32
          PYTHONPATH=/tmp/zombie-arm-test-deps python3 - <<'PY'
          from elftools.elf.elffile import ELFFile
          profiling={
            '_ZN12VID_SOFTWARE4DrawEPK6SPRITE':0x514bfc,
            '_ZN12VID_SOFTWARE9DrawToVidEPK10SpriteInfoPK11VID_TEXCOORP7TEXTURES7_':0x514a4c,
            '_ZN12VID_SOFTWARE14preparePaletteEPhPK6SPRITERK5Gamma':0x513488,
            '_ZN12VID_SOFTWARE9draw_implEiiiiP5ColorPtiiPv':0x513610,
          }
          gamma={'_ZN3VID17SetGammaToPaletteEPhRK5Gamma':0x506378}
          engine={
            '_ZN5GRAPH4TactEi':0x410a30,
            '_ZN5GRAPH12softwareTactEi':0x410458,
            '_ZN3MAP4tactEv':0x4372c4,
          }
          profiling_prologue=bytes.fromhex('f0b503af2de9000f')
          gamma_prologue=bytes.fromhex('f0b503af4df8048d')
          engine_prologue=bytes.fromhex('f0b503af2de9000f')
          with open('demo/libzombie_shooter.so','rb') as f:
            elf=ELFFile(f); dyn=elf.get_section_by_name('.dynsym')
            syms={s.name:s for s in dyn.iter_symbols()}
            text=elf.get_section_by_name('.text'); data=text.data(); base=text['sh_addr']
            for name,addr in profiling.items():
              s=syms.get(name); assert s is not None,name
              assert (s['st_value'] & ~1)==addr,(name,hex(s['st_value']))
              assert data[addr-base:addr-base+8]==profiling_prologue,(name,data[addr-base:addr-base+8].hex())
            for name,addr in gamma.items():
              s=syms.get(name); assert s is not None,name
              assert (s['st_value'] & ~1)==addr,(name,hex(s['st_value']))
              assert data[addr-base:addr-base+8]==gamma_prologue,(name,data[addr-base:addr-base+8].hex())
            for name,addr in engine.items():
              s=syms.get(name); assert s is not None,name
              assert (s['st_value'] & ~1)==addr,(name,hex(s['st_value']))
              assert data[addr-base:addr-base+8]==engine_prologue,(name,data[addr-base:addr-base+8].hex())
            assert syms['_ZN5GRAPH4TactEi']['st_size']==4512
            assert syms['_ZN5GRAPH12softwareTactEi']['st_size']==1148
            assert syms['_ZN3MAP4tactEv']['st_size']==1824
            print('PASS canonical Pass12 render symbols, sizes and prologues')
          PY
          arm-vita-eabi-objdump -d -C --start-address=0x437570 --stop-address=0x4375a0 demo/libzombie_shooter.so > /tmp/map-render-order.txt
          grep -qi '437580:.*8c77f0' /tmp/map-render-order.txt
          grep -qi '43758c:.*8c7810' /tmp/map-render-order.txt
          echo 'PASS MAP::tact canonical order softwareTact -> GRAPH::Tact'
      - name: ARM equivalence regressions
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/zombie-arm-test-deps bash tests/run_raster_palette_regression.sh
          PYTHONPATH=/tmp/zombie-arm-test-deps bash tests/run_raster_alpha_regression.sh
      - name: Build Debug
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cmake -S . -B build-pass12-debug -DCMAKE_BUILD_TYPE=Debug -DZOMBIE_BUILD_ID="$GITHUB_SHA"
          cmake --build build-pass12-debug -j"$(nproc)" 2>&1 | tee build-pass12-debug.log
          test -s build-pass12-debug/zombie_shooter.vpk
          test -s build-pass12-debug/so_loader
          unzip -t build-pass12-debug/zombie_shooter.vpk
      - name: Build Release
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cmake -S . -B build-pass12-release -DCMAKE_BUILD_TYPE=Release -DZOMBIE_BUILD_ID="$GITHUB_SHA"
          cmake --build build-pass12-release -j"$(nproc)" 2>&1 | tee build-pass12-release.log
          test -s build-pass12-release/zombie_shooter.vpk
          test -s build-pass12-release/so_loader
          unzip -t build-pass12-release/zombie_shooter.vpk
          python3 scripts/check_release_flags.py build-pass12-release
          git diff --check
      - name: Package test build
        run: |
          mkdir -p pass12-dist
          cp build-pass12-release/zombie_shooter.vpk pass12-dist/Zombie-Shooter-Pass12-Release.vpk
          cp build-pass12-release/so_loader pass12-dist/Zombie-Shooter-Pass12-Release.elf
          cp build-pass12-debug/zombie_shooter.vpk pass12-dist/Zombie-Shooter-Pass12-Debug.vpk
          cp build-pass12-debug/so_loader pass12-dist/Zombie-Shooter-Pass12-Debug.elf
          cp build-pass12-release.log build-pass12-debug.log pass12-dist/
          sha256sum pass12-dist/*.vpk pass12-dist/*.elf > pass12-dist/SHA256SUMS.txt
          sha256sum demo/libzombie_shooter.so > pass12-dist/so-reference.sha256.txt
      - name: Upload Pass12 build
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-Pass12-${{ github.sha }}
          path: pass12-dist
          if-no-files-found: error
          retention-days: 14

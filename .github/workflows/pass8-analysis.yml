name: Pass8 SO analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze-software-renderer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabihf
      - name: Analyze canonical SO
        run: |
          set -euo pipefail
          out=pass8-analysis.txt
          {
            echo '=== SHA256 ==='
            sha256sum demo/libzombie_shooter.so
            file demo/libzombie_shooter.so
            echo '=== RELEVANT SYMBOLS ==='
            arm-linux-gnueabihf-nm -D -n -C demo/libzombie_shooter.so | \
              grep -E 'GRAPH::softwareTact|VID_SOFTWARE|VID_SURFACE|SOFT_DRAW|SPRITE_COLLECTOR|DrawLayer|draw_impl|DrawWithAlpha|palette|pallete' || true
            echo '=== softwareTact 0x410458..0x4108d4 ==='
            arm-linux-gnueabihf-objdump -d -C --start-address=0x410458 --stop-address=0x4108d4 demo/libzombie_shooter.so
            echo '=== DrawLayer 0x4f4b20..0x4f4dbc ==='
            arm-linux-gnueabihf-objdump -d -C --start-address=0x4f4b20 --stop-address=0x4f4dbc demo/libzombie_shooter.so
            echo '=== VID core 0x513488..0x514d3c ==='
            arm-linux-gnueabihf-objdump -d -C --start-address=0x513488 --stop-address=0x514d3c demo/libzombie_shooter.so
            echo '=== RELOCATIONS / PLT ==='
            arm-linux-gnueabihf-readelf -rW demo/libzombie_shooter.so
            arm-linux-gnueabihf-objdump -d -C -j .plt demo/libzombie_shooter.so
          } > "$out" 2>&1
          wc -l "$out"
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: pass8-so-analysis-refined
          path: pass8-analysis.txt
          if-no-files-found: error

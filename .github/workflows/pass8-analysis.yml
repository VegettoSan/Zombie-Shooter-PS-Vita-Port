name: Pass10 validation
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  validate-pass10:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify canonical SO
        run: |
          set -euo pipefail
          echo '5e5e2e1bbe86e126c3e2dce5ad97c2e9dc6282305ea7d3e24b49ee4769c5b5b7  demo/libzombie_shooter.so' | sha256sum -c -
      - name: Install exact SoftFP SDK
        run: bash scripts/install_baseline_sdk.sh
      - name: Host regressions
        run: |
          set -euo pipefail
          tests/run_jni_field_regression.sh
          bash tests/run_gamepad_regression.sh
          python3 tests/run_render_scale_regression.py
          tests/run_gl_buffer_regression.sh
          tests/run_logger_regression.sh
          bash tests/run_texture_update_regression.sh
          bash tests/run_framebuffer_565_regression.sh
          bash tests/run_asset_index_regression.sh
          bash tests/run_engine_probe_regression.sh
          python3 tests/run_gamma_palette_regression.py
      - name: Verify canonical profiling and gamma symbols
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --target /tmp/zombie-arm-test-deps unicorn==2.1.4 pyelftools==0.32
          PYTHONPATH=/tmp/zombie-arm-test-deps python3 - <<'PY'
          from elftools.elf.elffile import ELFFile
          profiling={
            '_ZN12VID_SOFTWARE4DrawEPK6SPRITE':0x514bfc,
            '_ZN12VID_SOFTWARE9DrawToVidEPK10SpriteInfoPK11VID_TEXCOORP7TEXTURES7_':0x514a4c,
            '_ZN12VID_SOFTWARE14preparePaletteEPhPK6SPRITERK5Gamma':0x513488,
            '_ZN12VID_SOFTWARE9draw_implEiiiiP5ColorPtiiPv':0x513610,
          }
          gamma={'_ZN3VID17SetGammaToPaletteEPhRK5Gamma':0x506378}
          profiling_prologue=bytes.fromhex('f0b503af2de9000f')
          gamma_prologue=bytes.fromhex('f0b503af4df8048d')
          with open('demo/libzombie_shooter.so','rb') as f:
            elf=ELFFile(f); dyn=elf.get_section_by_name('.dynsym')
            syms={s.name:s for s in dyn.iter_symbols()}
            text=elf.get_section_by_name('.text'); data=text.data(); base=text['sh_addr']
            for name,addr in profiling.items():
              s=syms.get(name); assert s is not None,name
              assert (s['st_value'] & ~1)==addr,(name,hex(s['st_value']))
              assert data[addr-base:addr-base+8]==profiling_prologue,(name,data[addr-base:addr-base+8].hex())
            for name,addr in gamma.items():
              s=syms.get(name); assert s is not None,name
              assert (s['st_value'] & ~1)==addr,(name,hex(s['st_value']))
              assert data[addr-base:addr-base+8]==gamma_prologue,(name,data[addr-base:addr-base+8].hex())
              print('PASS gamma hook',name,hex(addr),gamma_prologue.hex())
          PY
      - name: ARM equivalence regressions
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/zombie-arm-test-deps bash tests/run_raster_palette_regression.sh
          PYTHONPATH=/tmp/zombie-arm-test-deps bash tests/run_raster_alpha_regression.sh
      - name: Build Debug
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cmake -S . -B build-pass10-debug -DCMAKE_BUILD_TYPE=Debug -DZOMBIE_BUILD_ID="$GITHUB_SHA"
          cmake --build build-pass10-debug -j"$(nproc)" 2>&1 | tee build-pass10-debug.log
          test -s build-pass10-debug/zombie_shooter.vpk
          test -s build-pass10-debug/so_loader
          unzip -t build-pass10-debug/zombie_shooter.vpk
      - name: Build Release
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cmake -S . -B build-pass10-release -DCMAKE_BUILD_TYPE=Release -DZOMBIE_BUILD_ID="$GITHUB_SHA"
          cmake --build build-pass10-release -j"$(nproc)" 2>&1 | tee build-pass10-release.log
          test -s build-pass10-release/zombie_shooter.vpk
          test -s build-pass10-release/so_loader
          unzip -t build-pass10-release/zombie_shooter.vpk
          python3 scripts/check_release_flags.py build-pass10-release
          git diff --check
      - name: Package test build
        run: |
          mkdir -p pass10-dist
          cp build-pass10-release/zombie_shooter.vpk pass10-dist/Zombie-Shooter-Pass10-Release.vpk
          cp build-pass10-release/so_loader pass10-dist/Zombie-Shooter-Pass10-Release.elf
          cp build-pass10-debug/zombie_shooter.vpk pass10-dist/Zombie-Shooter-Pass10-Debug.vpk
          cp build-pass10-debug/so_loader pass10-dist/Zombie-Shooter-Pass10-Debug.elf
          cp build-pass10-release.log build-pass10-debug.log pass10-dist/
          sha256sum pass10-dist/*.vpk pass10-dist/*.elf > pass10-dist/SHA256SUMS.txt
          sha256sum demo/libzombie_shooter.so > pass10-dist/so-reference.sha256.txt
      - name: Upload Pass10 build
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Shooter-Pass10-${{ github.sha }}
          path: pass10-dist
          if-no-files-found: error
          retention-days: 14

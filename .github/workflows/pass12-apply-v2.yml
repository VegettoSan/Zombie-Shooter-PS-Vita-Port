name: Pass12 apply v2
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/run16-disable-render-scale
          fetch-depth: 0
      - name: Apply Pass12 source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s: return False
              n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected one anchor, found {n}')
              p.write_text(s.replace(old,new,1)); return True

          changed=False
          changed |= replace_once('source/patch.c', '''ENGINE_INT_PROBE(graph,PERF_ENGINE_GRAPH)\n\n/* Pass 11: MetalSyntax-style render reuse.  GRAPH::Tact/MAP/input/audio keep\n * running every engine tick; only the expensive software raster pass is\n * reused every other tick.  The opaque original return is preserved so no\n * caller contract changes.  glTexSubImage2D_soloader sees the per-tick flag\n * and skips only OpenGLES::UnLock's full software-framebuffer upload. */\nvolatile int zombie_render_reuse_active_this_tick = 0;\nstatic uintptr_t render_reuse_last_software_result;\nstatic unsigned render_reuse_phase;\nstatic unsigned render_reuse_rendered;\nstatic unsigned render_reuse_reused;\nstatic int render_reuse_has_frame;''', '''/* Pass 12: canonical MAP::tact calls softwareTact at SO+0x437580 and\n * GRAPH::Tact immediately after at SO+0x43758C. Static call-graph analysis\n * shows GRAPH::Tact is render-only (DrawLayer/batch/state calls), so reuse it\n * on the exact same alternate ticks. MAP logic, input, scripts, multiplayer\n * and SPRITE_COLLECTOR::squeeze still execute every engine tick. */\nvolatile int zombie_render_reuse_active_this_tick = 0;\nstatic uintptr_t render_reuse_last_software_result;\nstatic uintptr_t render_reuse_last_graph_result;\nstatic unsigned render_reuse_phase;\nstatic unsigned render_reuse_rendered;\nstatic unsigned render_reuse_reused;\nstatic unsigned graph_rendered;\nstatic unsigned graph_reused;\nstatic int render_reuse_has_frame;\nstatic int render_reuse_has_graph;''')

          changed |= replace_once('source/patch.c', '''static uintptr_t probe_software(void *self,int argument) {\n    int reuse = setting_software_frameskip && render_reuse_has_frame &&\n                ((render_reuse_phase++ & 1u) != 0);\n    if (reuse) {\n        zombie_render_reuse_active_this_tick = 1;\n        render_reuse_reused++;\n        return render_reuse_last_software_result;\n    }\n    zombie_render_reuse_active_this_tick = 0;\n    uint64_t start=sceKernelGetProcessTimeWide();\n    uintptr_t ret=((uintptr_t (*)(void *,int))engine_original[PERF_ENGINE_SOFTWARE])(self,argument);\n    perf_engine_phase(PERF_ENGINE_SOFTWARE,start);\n    render_reuse_last_software_result=ret;\n    render_reuse_has_frame=1;\n    render_reuse_rendered++;\n    return ret;\n}\n\nvoid render_reuse_report(void) {\n    static unsigned old_rendered,old_reused;\n    unsigned rendered=render_reuse_rendered, reused=render_reuse_reused;\n    l_perf("render_reuse config=%d rendered_ticks=%u reused_ticks=%u has_frame=%d current_reuse=%d strategy=softwareTact_2to1",\n        setting_software_frameskip,rendered-old_rendered,reused-old_reused,\n        render_reuse_has_frame,zombie_render_reuse_active_this_tick);\n    old_rendered=rendered;old_reused=reused;\n}\n''', '''static uintptr_t probe_software(void *self,int argument) {\n    int reuse = setting_software_frameskip && render_reuse_has_frame &&\n                ((render_reuse_phase++ & 1u) != 0);\n    if (reuse) {\n        zombie_render_reuse_active_this_tick = 1;\n        render_reuse_reused++;\n        return render_reuse_last_software_result;\n    }\n    zombie_render_reuse_active_this_tick = 0;\n    uint64_t start=sceKernelGetProcessTimeWide();\n    uintptr_t ret=((uintptr_t (*)(void *,int))engine_original[PERF_ENGINE_SOFTWARE])(self,argument);\n    perf_engine_phase(PERF_ENGINE_SOFTWARE,start);\n    render_reuse_last_software_result=ret;\n    render_reuse_has_frame=1;\n    render_reuse_rendered++;\n    return ret;\n}\n\nstatic uintptr_t probe_graph(void *self,int argument) {\n    if (setting_software_frameskip && zombie_render_reuse_active_this_tick &&\n        render_reuse_has_graph) {\n        graph_reused++;\n        return render_reuse_last_graph_result;\n    }\n    uint64_t start=sceKernelGetProcessTimeWide();\n    uintptr_t ret=((uintptr_t (*)(void *,int))engine_original[PERF_ENGINE_GRAPH])(self,argument);\n    perf_engine_phase(PERF_ENGINE_GRAPH,start);\n    render_reuse_last_graph_result=ret;\n    render_reuse_has_graph=1;\n    graph_rendered++;\n    return ret;\n}\n\nvoid render_reuse_report(void) {\n    static unsigned old_rendered,old_reused,old_graph_rendered,old_graph_reused;\n    unsigned rendered=render_reuse_rendered, reused=render_reuse_reused;\n    unsigned gr=graph_rendered, gu=graph_reused;\n    l_perf("render_reuse config=%d rendered_ticks=%u reused_ticks=%u graph_rendered_ticks=%u graph_reused_ticks=%u has_frame=%d has_graph=%d current_reuse=%d strategy=software_graph_2to1",\n        setting_software_frameskip,rendered-old_rendered,reused-old_reused,\n        gr-old_graph_rendered,gu-old_graph_reused,render_reuse_has_frame,\n        render_reuse_has_graph,zombie_render_reuse_active_this_tick);\n    old_rendered=rendered;old_reused=reused;old_graph_rendered=gr;old_graph_reused=gu;\n}\n''')

          changed |= replace_once('source/utils/perf.h', '''typedef struct { AudioWaitStats clear, destroy; unsigned output_calls, output_errors; } AudioPerfStats;\nvoid audio_perf_call(unsigned kind);\nvoid audio_perf_wait(unsigned kind, unsigned us, int timeout);\nvoid audio_perf_output(int result);''', '''typedef struct {\n    AudioWaitStats clear, destroy;\n    unsigned output_calls, output_errors, output_frames, output_late_intervals, output_max_gap_us;\n} AudioPerfStats;\nvoid audio_perf_call(unsigned kind);\nvoid audio_perf_wait(unsigned kind, unsigned us, int timeout);\nvoid audio_perf_output(int result, unsigned frames, unsigned gap_us, int late);''')
          changed |= replace_once('source/utils/perf.c', 'void audio_perf_output(int result) { ADD(&audio.output_calls, 1); if (result < 0) ADD(&audio.output_errors, 1); }', '''void audio_perf_output(int result, unsigned frames, unsigned gap_us, int late) {\n    ADD(&audio.output_calls, 1);\n    ADD(&audio.output_frames, frames);\n    if (result < 0) ADD(&audio.output_errors, 1);\n    if (late) ADD(&audio.output_late_intervals, 1);\n    max_relaxed(&audio.output_max_gap_us, gap_us);\n}''')
          changed |= replace_once('source/utils/perf.c', '    COPY(output_calls); COPY(output_errors);', '    COPY(output_calls); COPY(output_errors); COPY(output_frames);\n    COPY(output_late_intervals); COPY(output_max_gap_us);')
          changed |= replace_once('source/utils/perf.c', '''    l_perf("audio clear_calls=%u clear_wait_calls=%u clear_wait_us=%u clear_max_us_lifetime=%u clear_timeouts=%u destroy_calls=%u destroy_wait_calls=%u destroy_wait_us=%u destroy_max_us_lifetime=%u destroy_timeouts=%u output_calls=%u output_errors=%u",\n        D(clear.calls),D(clear.wait_calls),D(clear.wait_us),now.clear.max_us,D(clear.timeouts),\n        D(destroy.calls),D(destroy.wait_calls),D(destroy.wait_us),now.destroy.max_us,D(destroy.timeouts),D(output_calls),D(output_errors));''', '''    l_perf("audio clear_calls=%u clear_wait_calls=%u clear_wait_us=%u clear_max_us_lifetime=%u clear_timeouts=%u destroy_calls=%u destroy_wait_calls=%u destroy_wait_us=%u destroy_max_us_lifetime=%u destroy_timeouts=%u output_calls=%u output_frames=%u output_errors=%u output_late_intervals=%u output_max_gap_us_lifetime=%u",\n        D(clear.calls),D(clear.wait_calls),D(clear.wait_us),now.clear.max_us,D(clear.timeouts),\n        D(destroy.calls),D(destroy.wait_calls),D(destroy.wait_us),now.destroy.max_us,D(destroy.timeouts),\n        D(output_calls),D(output_frames),D(output_errors),D(output_late_intervals),now.output_max_gap_us);''')

          changed |= replace_once('lib/opensles_clear/Vita.c', 'uint8_t audio_buffers[SndFile_NUMBUFS][SndFile_BUFSIZE];', '''#define VITA_AUDIO_OUT_FRAMES 1024u\n#define VITA_AUDIO_OUT_BYTES (VITA_AUDIO_OUT_FRAMES * 2u * sizeof(int16_t))\n#define VITA_AUDIO_OUT_BUFFERS 4u\nstatic uint8_t audio_buffers[VITA_AUDIO_OUT_BUFFERS][VITA_AUDIO_OUT_BYTES] __attribute__((aligned(64)));''')

          p=Path('lib/opensles_clear/Vita.c'); s=p.read_text()
          anchor='\tint ch = sceAudioOutOpenPort(SCE_AUDIO_OUT_PORT_TYPE_BGM,'
          insert='''\tconst int output_hz=opensles_output_freq();\n\tconst unsigned expected_period_us=(unsigned)(((uint64_t)VITA_AUDIO_OUT_FRAMES*1000000u)/(unsigned)output_hz);\n\tconst unsigned late_period_us=expected_period_us+(expected_period_us>>1);\n'''
          if insert not in s:
              if s.count(anchor)!=1: raise SystemExit(f'Vita.c open-port anchor count={s.count(anchor)}')
              s=s.replace(anchor,insert+anchor,1); changed=True
          count=s.count('SndFile_BUFSIZE / 4')
          if count:
              if count != 3: raise SystemExit(f'Vita.c expected 3 frame-grain uses, found {count}')
              s=s.replace('SndFile_BUFSIZE / 4','VITA_AUDIO_OUT_FRAMES'); changed=True
          info_anchor='\t\tSL_LOGI("Opened Vita audio port %d", ch);'
          info='''\n\t\t_log_print(1, "[AUDIO] output buffering bytes=%u buffers=%u period_us=%u late_us=%u",\n\t\t\t(unsigned)VITA_AUDIO_OUT_BYTES,(unsigned)VITA_AUDIO_OUT_BUFFERS,\n\t\t\texpected_period_us,late_period_us);'''
          if info not in s:
              if s.count(info_anchor)!=1: raise SystemExit('Vita.c success log anchor missing')
              s=s.replace(info_anchor,info_anchor+info,1); changed=True
          p.write_text(s)

          changed |= replace_once('lib/opensles_clear/Vita.c', '''\tint buf_idx = 0;\n\n\twhile (!audio_shutdown_requested) {\n\t\tuint8_t *stream = audio_buffers[buf_idx];\n\t\tbuf_idx = (buf_idx + 1) % SndFile_NUMBUFS;\n\n\t\tfill_output_buffer(stream, (SLuint32)SndFile_BUFSIZE);\n\t\tres = sceAudioOutOutput(ch, stream);\n\t\taudio_perf_output(res);''', '''\tunsigned buf_idx = 0;\n\tuint64_t last_output_start_us=0;\n\n\twhile (!audio_shutdown_requested) {\n\t\tuint8_t *stream = audio_buffers[buf_idx];\n\t\tbuf_idx = (buf_idx + 1u) % VITA_AUDIO_OUT_BUFFERS;\n\n\t\tfill_output_buffer(stream, (SLuint32)VITA_AUDIO_OUT_BYTES);\n\t\tuint64_t output_start_us=sceKernelGetProcessTimeWide();\n\t\tunsigned gap_us=last_output_start_us?(unsigned)(output_start_us-last_output_start_us):0;\n\t\tlast_output_start_us=output_start_us;\n\t\tres = sceAudioOutOutput(ch, stream);\n\t\taudio_perf_output(res,VITA_AUDIO_OUT_FRAMES,gap_us,gap_us>late_period_us);''')

          if not changed: print('Pass12 already applied')
          PY
          if git diff --quiet; then echo 'No changes to commit'; exit 0; fi
          git diff --check
          grep -q 'strategy=software_graph_2to1' source/patch.c
          grep -q '#define VITA_AUDIO_OUT_FRAMES 1024u' lib/opensles_clear/Vita.c
          grep -q 'output_late_intervals' source/utils/perf.c
          grep -q 'audio_perf_output(res,VITA_AUDIO_OUT_FRAMES' lib/opensles_clear/Vita.c
          git config user.name 'VegettoSanDev'
          git config user.email '72358120+VegettoSan@users.noreply.github.com'
          git add source/patch.c source/utils/perf.c source/utils/perf.h lib/opensles_clear/Vita.c
          git commit -m 'perf: reuse graph pass and harden audio buffering'
          git push origin HEAD:fix/run16-disable-render-scale

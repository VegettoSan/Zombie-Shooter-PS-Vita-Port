name: Pass11 softwareTact analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Disassemble GRAPH hot path
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-objdump -d -C -M force-thumb demo/libzombie_shooter.so > /tmp/all-disasm.txt
          {
            echo '=== SYMBOLS ==='
            arm-linux-gnueabihf-nm -D -C demo/libzombie_shooter.so | grep -E 'GRAPH::(Tact|softwareTact)|OpenGLES::(UnLock|PostTact)' || true
            echo '=== softwareTact callers ==='
            grep -n -B12 -A16 -E '<GRAPH::softwareTact\(int\)|410458' /tmp/all-disasm.txt || true
            echo '=== PostTact callers ==='
            grep -n -B12 -A16 -E '<OpenGLES::PostTact\(int\)|46af1c' /tmp/all-disasm.txt || true
            echo '=== Tact epilogue / returns ==='
            arm-linux-gnueabihf-objdump -d -C -M force-thumb --start-address=0x411200 --stop-address=0x411900 demo/libzombie_shooter.so
          } > pass11-analysis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass11-softwareTact-analysis
          path: pass11-analysis.txt
          retention-days: 3

name: Pass11 source analysis
on:
  push:
    branches:
      - fix/run16-disable-render-scale
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify corrected VitaGL result
        run: |
          set -euo pipefail
          git -C lib/vitagl apply --ignore-space-change --check "$GITHUB_WORKSPACE/patches/vitagl.patch"
          git -C lib/vitagl apply --ignore-space-change "$GITHUB_WORKSPACE/patches/vitagl.patch"
          git -C lib/vitagl apply --recount --ignore-space-change --check "$GITHUB_WORKSPACE/patches/vitagl_pass10.patch"
          git -C lib/vitagl apply --recount --ignore-space-change "$GITHUB_WORKSPACE/patches/vitagl_pass10.patch"
          python3 - <<'PY' > pass11-analysis.txt
          import hashlib
          from pathlib import Path
          for name in ['lib/vitagl/source/textures.c','lib/vitagl/source/utils/zombie_texture_update.h']:
              data=Path(name).read_bytes().replace(b'\r\n',b'\n')
              print(hashlib.sha256(data).hexdigest(), name)
          PY
          grep -n -A18 -B4 'zombie_texture_rgba8888_pixel_to_rgb565' lib/vitagl/source/utils/zombie_texture_update.h >> pass11-analysis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass11-source-analysis
          path: pass11-analysis.txt
          retention-days: 3
